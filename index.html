<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="images/atp-logo.png">
<meta property="og:title" content="Defend the Kitchen: Interclub II">
<meta property="og:description" content="ATP vs Port Stephens Pickleball Club, Sunday 31 January 2027, Jonas Bradley Park">
<meta property="og:image" content="images/trophy-tug.jpg">
<title>Defend the Kitchen</title>

<meta name="description" content="Defend the Kitchen: Interclub II. ATP Pickleball Club vs Port Stephens Pickleball Club, Sunday 31 January 2027, Jonas Bradley Park.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Instrument+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: one screen. A pickleball court from above (ATP half | kitchen | Port Stephens half),
   then the day countdown beside the trophy photo. Sizes scale with screen height so it all fits. */
:root{
  color-scheme: dark;
  --ground:#081826;
  --line:#f4f6f2;
  --ink:#eef2ee;
  --ink-soft:#a9b8c4;
  --atp-navy:#0b3149;
  --atp-lime:#c3d22b;
  --ps-blue:#2f5fcf;
  --ps-gold:#f2cd2e;
  --ps-navy:#1a2a6c;
  --kitchen:#e9ecdf;
  --display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
img{max-width:100%}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,p{margin:0}
.page{
  min-height:100%;max-width:1100px;margin:0 auto;
  display:flex;flex-direction:column;gap:clamp(10px,2.2vh,22px);
  padding-block:clamp(10px,2vh,20px);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}

/* ---------- court ---------- */
/* Built without overflow clipping, filters or %-height images: iPhone Safari skipped painting the old version. */
.court{
  display:grid;grid-template-columns:15fr 14fr 15fr;
  height:clamp(170px,40vh,400px);
  border:3px solid var(--line);border-radius:6px;
  background:var(--line);gap:3px;
  box-shadow:0 24px 60px -30px rgba(0,0,0,.7);
}
.half,.kitchen{position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-width:0;min-height:0}
.half{gap:8px;padding:10px}
.half.atp{background:linear-gradient(135deg,var(--atp-navy),#0f4462);border-radius:3px 0 0 3px}
.half.ps{background:linear-gradient(225deg,var(--ps-blue),var(--ps-navy));border-radius:0 3px 3px 0}
.half::before{content:"";position:absolute;z-index:-1;left:0;right:0;top:50%;height:3px;margin-top:-1px;background:rgba(244,246,242,.85)}
.half img{display:block;height:clamp(80px,24vh,250px);width:auto;max-width:85%;object-fit:contain}
.half .tag{font-family:var(--display);font-weight:800;font-size:clamp(.7rem,1.6vh,.95rem);letter-spacing:.08em;text-transform:uppercase;padding:2px 9px;border-radius:3px;white-space:nowrap}
.atp .tag{background:var(--atp-lime);color:var(--atp-navy)}
.ps .tag{background:var(--ps-gold);color:var(--ps-navy)}
.kitchen{background:var(--kitchen);color:var(--ground);padding:10px 6px}
.kitchen::before{content:"";position:absolute;z-index:-1;top:0;bottom:0;left:50%;width:5px;margin-left:-2px;
  background:repeating-linear-gradient(180deg,rgba(27,39,51,.28) 0 3px,transparent 3px 9px)}
.kitchen h1{font-family:var(--display);font-weight:900;line-height:.9;text-transform:uppercase;color:var(--ground);font-size:4.8rem;font-size:min(9.5vh,6.2vw,4.8rem)}
.kitchen h1 span{display:block}
.kitchen h1 .the{font-size:.42em;letter-spacing:.2em;color:#4a5848}
.kitchen .sub{margin-top:8px;font-family:var(--display);font-weight:800;font-size:1.2rem;font-size:min(3vh,3.2vw,1.4rem);letter-spacing:.14em;text-transform:uppercase;background:var(--ground);color:var(--kitchen);padding:2px 10px;border-radius:3px;white-space:nowrap}

.matchline{display:flex;justify-content:center;align-items:baseline;gap:10px;flex-wrap:wrap;font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:clamp(1rem,2.6vh,1.5rem);text-align:center}
.matchline .vs{font-size:.7em;color:var(--ink-soft)}
.matchline .a{color:var(--atp-lime)}
.matchline .p{color:var(--ps-gold)}

/* ---------- countdown + photo ---------- */
.lower{flex:1;display:grid;grid-template-columns:1fr 1.5fr;gap:clamp(16px,3vw,36px);align-items:center;min-height:0}
.when{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;min-width:0}
.days{display:flex;align-items:baseline;justify-content:center;gap:12px;flex-wrap:wrap}
.days b{font-family:var(--display);font-weight:900;font-size:clamp(3.6rem,13vh,8rem);line-height:.85;font-variant-numeric:tabular-nums;color:var(--atp-lime)}
.days span{font-family:var(--display);font-weight:800;font-size:clamp(1.3rem,3.6vh,2.2rem);text-transform:uppercase;letter-spacing:.05em}
.date{margin-top:6px;font-family:var(--display);font-weight:800;font-size:clamp(1.1rem,2.8vh,1.6rem);letter-spacing:.07em;text-transform:uppercase;color:var(--ps-gold)}
.venue{color:var(--ink-soft)}
.photo{margin:0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.photo img{display:block;max-width:100%;max-height:clamp(150px,33vh,380px);width:auto;height:auto;border-radius:6px;border:3px solid var(--line);transform:rotate(-1deg);box-shadow:0 18px 44px -20px rgba(0,0,0,.8)}
.photo figcaption{font-size:.85rem;color:var(--ink-soft);text-align:center}

footer{font-size:.75rem;color:var(--ink-soft);text-align:center}

@media (max-width:700px){
  .court{height:clamp(150px,26vh,230px)}
  .half img{height:clamp(70px,15vh,140px)}
  .half{padding:8px 4px}
  .half .tag{font-size:.6rem;padding:2px 5px;white-space:normal;max-width:100%}
  .kitchen{padding:8px 4px}
  .kitchen h1{font-size:1.7rem;font-size:min(7vw,5.5vh)}
  .kitchen .sub{font-size:.7rem;padding:2px 6px}
  .lower{grid-template-columns:1fr;gap:14px;align-content:start}
  .when{align-items:center;text-align:center}
  .days{justify-content:center}
  .days b{font-size:clamp(3.2rem,10vh,5rem)}
  .photo img{max-height:30vh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="page">
  <span class="eyebrow">Interclub II · Hosted by ATP at Jonas Bradley Park</span>

  <div class="court" aria-label="ATP versus Port Stephens">
    <div class="half atp">
      <img src="images/atp-logo.png" alt="ATP Pickleball Club logo" width="470" height="512">
      <span class="tag">Defending champs</span>
    </div>
    <div class="kitchen">
      <h1><span class="the">Defend the</span><span>Kitchen</span></h1>
      <span class="sub">Interclub II</span>
    </div>
    <div class="half ps">
      <img src="images/ps-logo.png" alt="Port Stephens Pickleball Club logo" width="512" height="422">
      <span class="tag">Challengers</span>
    </div>
  </div>

  <div class="matchline"><span class="a">ATP</span><span class="vs">vs</span><span class="p">Port Stephens</span></div>

  <div class="lower">
    <div class="when">
      <div class="days" aria-live="polite"><b id="cd-d">–</b><span id="cd-l">days to go</span></div>
      <p class="date">Sunday 31 January 2027</p>
      <p class="venue">Jonas Bradley Park · ATP's home courts</p>
    </div>
    <figure class="photo">
      <img src="images/trophy-tug.jpg" alt="The two club presidents playfully pulling the trophy in opposite directions" width="1400" height="1004">
      <figcaption>ATP has it. Port Stephens wants it. More details soon.</figcaption>
    </figure>
  </div>

  <footer>Defend the Kitchen · ATP Pickleball Club vs Port Stephens Pickleball Club</footer>
</div>

<script>
(function(){
  // Midnight starting Sunday 31 January 2027, Sydney time (AEDT, UTC+11)
  var gameDay = Date.UTC(2027,0,30,13,0,0), dayMs = 86400000;
  var num = document.getElementById('cd-d'), label = document.getElementById('cd-l');
  function update(){
    var diff = gameDay - Date.now();
    if (diff > 0) { var d = Math.ceil(diff/dayMs); num.textContent = d; label.textContent = d === 1 ? 'day to go' : 'days to go'; }
    else if (diff > -dayMs) { num.textContent = 'Game'; label.textContent = 'day'; }
    else { num.textContent = 'Final'; label.textContent = 'thanks for playing'; }
  }
  update(); setInterval(update, 60000);
})();
</script>
</body>
</html>
